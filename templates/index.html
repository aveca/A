<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Agent</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0a0a0a; color:#eee; }
    .container { max-width:800px; margin:0 auto; padding:16px; display:flex; flex-direction:column; min-height:100dvh; gap:12px; }
    h1 { font-size:1.1rem; color:#38bdf8; text-align:center; padding:6px 0; }
    .cam-wrap { position:relative; background:#1a1a1a; border-radius:16px; overflow:hidden; aspect-ratio:4/3; }
    #video { width:100%; height:100%; object-fit:cover; }
    #canvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; }
    #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#888; font-size:0.9rem; text-align:center; z-index:1; }
    .coach { background:#1a1a1a; border-radius:16px; padding:16px; }
    .activity { text-align:center; }
    .activity .label { font-size:0.7rem; color:#888; text-transform:uppercase; letter-spacing:0.5px; }
    .activity .val { font-size:1.3rem; color:#38bdf8; font-weight:600; margin-top:4px; }
    .suggestion { background:#0f172a; border-radius:12px; padding:14px; margin-top:12px; border-left:3px solid #818cf8; }
    .suggestion .label { font-size:0.7rem; color:#888; text-transform:uppercase; letter-spacing:0.5px; }
    .suggestion .val { font-size:1rem; color:#e2e8f0; margin-top:6px; line-height:1.5; }
    .timer { font-size:0.8rem; color:#666; text-align:center; margin-top:8px; }
    .detections { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; min-height:24px; }
    .detections .tag { background:#1e293b; color:#94a3b8; padding:3px 10px; border-radius:12px; font-size:0.75rem; }
    .detections .tag .conf { color:#38bdf8; }
    .btn { margin:12px auto 0; padding:12px 32px; border:none; border-radius:40px; font-size:1rem; font-weight:600; cursor:pointer; background:linear-gradient(135deg,#38bdf8,#818cf8); color:#fff; display:block; }
    .btn:active { transform:scale(0.97); }
  </style>
</head>
<body>
<div class="container">
  <h1>Vision Agent</h1>
  <div class="cam-wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="loading">Clique "Démarrer" pour activer la caméra</div>
  </div>
  <div class="coach">
    <div class="activity">
      <div class="label">Activité</div>
      <div class="val" id="activityText">Analyse...</div>
    </div>
    <div class="suggestion">
      <div class="label">Conseil</div>
      <div class="val" id="suggestionText">Rien pour l'instant</div>
    </div>
    <div class="timer" id="timer">--:--</div>
    <button class="btn" id="btnStart">Activer ma webcam</button>
  </div>
  <div class="detections" id="detectionTags"></div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const activityEl = document.getElementById('activityText');
const suggestionEl = document.getElementById('suggestionText');
const timerEl = document.getElementById('timer');
const loadingEl = document.getElementById('loading');
const tagsEl = document.getElementById('detectionTags');
const btnStart = document.getElementById('btnStart');

let running = false, stream = null, animId = null;
let startTime = Date.now();

btnStart.onclick = async () => {
  if (running) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (animId) cancelAnimationFrame(animId);
    running = false;
    btnStart.textContent = 'Activer ma webcam';
    loadingEl.textContent = 'Arrêté';
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  try {
    loadingEl.textContent = 'Demande d\'accès caméra...';
    stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    loadingEl.textContent = '';
    running = true;
    startTime = Date.now();
    btnStart.textContent = 'Arrêter';
    btnStart.style.background = 'linear-gradient(135deg,#ef4444,#f97316)';
    setInterval(refreshCoach, 3000);
    detectLoop();
  } catch(e) {
    loadingEl.textContent = 'Caméra refusée. Vérifie les permissions.';
  }
};

function detectLoop() {
  if (!running) return;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(async blob => {
    const form = new FormData();
    form.append('image', blob, 'f.jpg');
    try {
      const r = await fetch('/detect', { method:'POST', body:form });
      const d = await r.json();
      tagsEl.innerHTML = (d.detections||[]).slice(0,12).map(o =>
        `<span class="tag">${o.class||o.label||'?'} <span class="conf">${Math.round((o.confidence||o.conf||0)*100)}%</span></span>`
      ).join('');
    } catch(e) {}
    requestAnimationFrame(detectLoop);
  }, 'image/jpeg', 0.7);
}

async function refreshCoach() {
  if (!running) return;
  try {
    const r = await fetch('/coach?_=' + Date.now());
    const d = await r.json();
    activityEl.textContent = d.activity || 'Analyse...';
    suggestionEl.textContent = d.suggestion || '';
  } catch(e) {}
}

setInterval(() => {
  const e = Math.floor((Date.now() - startTime) / 1000);
  if (e > 0) timerEl.textContent = String(Math.floor(e/60)).padStart(2,'0') + ':' + String(e%60).padStart(2,'0');
}, 1000);
</script>
</body>
</html>
